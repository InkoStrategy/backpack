<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тактична карта</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    overflow: hidden;
  }

  #map {
    width: 100%; height: 100%;
  }

  /* Mil-symbol marker wrapper */
  .mil-symbol-icon {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }

  /* Symbol label tooltip */
  .mil-label-tooltip {
    background: rgba(10, 20, 40, 0.85) !important;
    border: 1px solid rgba(74, 158, 255, 0.4) !important;
    border-radius: 2px !important;
    box-shadow: none !important;
    color: #d4e8ff !important;
    font-family: 'Segoe UI', 'Arial', sans-serif !important;
    font-size: 10px !important;
    font-weight: 600 !important;
    padding: 2px 5px !important;
    white-space: nowrap !important;
  }
  .mil-label-tooltip::before {
    border-top-color: rgba(74, 158, 255, 0.4) !important;
  }

  /* Leaflet attribution */
  .leaflet-control-attribution {
    background: rgba(10, 20, 40, 0.7) !important;
    color: #4a6080 !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: #4a7ab0 !important; }

  /* Scale control */
  .leaflet-control-scale-line {
    background: rgba(10, 20, 40, 0.75);
    border-color: #4a9eff;
    color: #c8d8e8;
    font-size: 10px;
  }

  /* Zoom control */
  .leaflet-control-zoom a {
    background: #0d1b2a;
    color: #4a9eff;
    border-color: #0f3460;
  }
  .leaflet-control-zoom a:hover {
    background: #1a4060;
    color: #6ab0ff;
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqPo=" crossorigin=""></script>

<!-- milsymbol.js — NATO APP-6D symbols -->
<script src="https://unpkg.com/milsymbol@2.2.1/dist/milsymbol.js"></script>

<!-- Qt WebChannel bridge -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
"use strict";

// ─── Map initialisation ───────────────────────────────────────────────────────
var map = L.map('map', {
  center: [49.0, 31.0],
  zoom: 8,
  zoomControl: true,
  attributionControl: true,
  renderer: L.canvas()
});

// ─── Tile layers ──────────────────────────────────────────────────────────────
var LAYERS = {
  dark: L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 19, attribution: '© <a href="https://carto.com">CARTO</a>' }
  ),
  light: L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org">OpenStreetMap</a>' }
  ),
  topo: L.tileLayer(
    'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    { maxZoom: 17, attribution: '© <a href="https://opentopomap.org">OpenTopoMap</a>' }
  ),
  sat: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: '© Esri' }
  )
};

var currentTheme = 'dark';
LAYERS.dark.addTo(map);

// ─── Layer control ────────────────────────────────────────────────────────────
var layerControl = L.control.layers(
  { 'Ніч (темна)': LAYERS.dark, 'День (OSM)': LAYERS.light,
    'Топографічна': LAYERS.topo, 'Супутник': LAYERS.sat },
  {}, { position: 'topright', collapsed: true }
).addTo(map);

// ─── Scale ────────────────────────────────────────────────────────────────────
L.control.scale({ imperial: false, maxWidth: 200, position: 'bottomright' }).addTo(map);

// ─── Symbol storage ───────────────────────────────────────────────────────────
var symbolMarkers  = {};   // id → Leaflet marker
var symbolData     = {};   // id → data dict
var symbolLatLngs  = [];   // for fitBounds

// ─── Python bridge ────────────────────────────────────────────────────────────
var pyBridge = null;

if (typeof qt !== 'undefined' && qt.webChannelTransport) {
  new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBridge = channel.objects.pyBridge;
  });
}

// ─── Map events ───────────────────────────────────────────────────────────────
map.on('click', function(e) {
  if (pyBridge) {
    pyBridge.onMapClicked(e.latlng.lat, e.latlng.lng);
  }
});

// Track which layer is active
map.on('baselayerchange', function(e) {
  for (var key in LAYERS) {
    if (LAYERS[key] === e.layer) { currentTheme = key; break; }
  }
});

// ─── NATO symbol helpers ──────────────────────────────────────────────────────

function affiliationFromSIDC(sidc) {
  if (!sidc || sidc.length < 4) return 'U';
  var code = parseInt(sidc.substring(2, 4), 10);
  if (code === 3 || code === 15) return 'F';
  if (code === 6 || code === 7)  return 'H';
  if (code === 4)                return 'N';
  return 'U';
}

function fallbackIcon(affil) {
  var colors = { F: '#005CE6', H: '#FF0000', N: '#00A651', U: '#FFFF00' };
  var c = colors[affil] || '#888';
  var html = '<div style="width:28px;height:28px;border-radius:4px;background:' + c +
    ';border:2px solid rgba(255,255,255,0.7);display:flex;align-items:center;' +
    'justify-content:center;font-size:13px;">✦</div>';
  return L.divIcon({ html: html, iconAnchor: [14, 14], iconSize: [28, 28],
    className: 'mil-symbol-icon' });
}

function buildMilIcon(sidc, echelon) {
  if (typeof ms === 'undefined') return null;
  try {
    var opts = { size: 42, infoFields: false };
    if (echelon) {
      var echelonMap = {
        '11':'Squad','12':'Section','13':'Platoon','14':'Company',
        '15':'Battalion','16':'Regiment','17':'Brigade',
        '18':'Division','19':'Corps','20':'Army'
      };
      var eStr = echelonMap[echelon];
      if (eStr) opts.echelon = eStr;
    }
    var sym = new ms.Symbol(sidc, opts);
    if (!sym || !sym.isValid || !sym.isValid()) return null;
    var svgStr = sym.asSVG();
    if (!svgStr) return null;
    var anchor = sym.getAnchor ? sym.getAnchor() : { x: 21, y: 21 };
    var sz = sym.getSize ? sym.getSize() : { width: 42, height: 42 };
    return L.divIcon({
      html: svgStr,
      iconAnchor: [anchor.x, anchor.y],
      iconSize: [sz.width, sz.height],
      className: 'mil-symbol-icon'
    });
  } catch(e) {
    return null;
  }
}

// ─── Public API (called from Python via runJavaScript) ────────────────────────

/**
 * addSymbol(data) — place a NATO symbol on the map.
 * data = { id, sidc, lat, lng, label, echelon, notes }
 */
function addSymbol(data) {
  var id      = data.id;
  var sidc    = data.sidc    || '10011000141211000000';
  var lat     = data.lat;
  var lng     = data.lng;
  var label   = data.label   || '';
  var echelon = data.echelon || '';

  var affil = affiliationFromSIDC(sidc);
  var icon  = buildMilIcon(sidc, echelon) || fallbackIcon(affil);

  var marker = L.marker([lat, lng], {
    icon: icon,
    draggable: true,
    title: label || sidc
  });

  if (label) {
    marker.bindTooltip(label, {
      permanent: false,
      direction: 'top',
      offset: [0, -22],
      className: 'mil-label-tooltip'
    });
  }

  marker.on('dragend', function(e) {
    var pos = e.target.getLatLng();
    if (symbolData[id]) {
      symbolData[id].lat = pos.lat;
      symbolData[id].lng = pos.lng;
    }
    if (pyBridge) pyBridge.onSymbolMoved(id, pos.lat, pos.lng);
  });

  marker.on('click', function() {
    if (pyBridge) pyBridge.onSymbolSelected(id);
  });

  marker.addTo(map);
  symbolMarkers[id] = marker;
  symbolData[id]    = data;
  symbolLatLngs.push([lat, lng]);

  return id;
}

/**
 * removeSymbol(id) — remove a single symbol.
 */
function removeSymbol(id) {
  if (symbolMarkers[id]) {
    map.removeLayer(symbolMarkers[id]);
    delete symbolMarkers[id];
    delete symbolData[id];
    _rebuildBounds();
  }
}

/**
 * clearAllSymbols() — remove every symbol from the map.
 */
function clearAllSymbols() {
  for (var id in symbolMarkers) {
    map.removeLayer(symbolMarkers[id]);
  }
  symbolMarkers = {};
  symbolData    = {};
  symbolLatLngs = [];
}

/**
 * fitAllSymbols() — fit the map view to show all placed symbols.
 */
function fitAllSymbols() {
  var latlngs = Object.values(symbolData).map(function(d) {
    return [d.lat, d.lng];
  });
  if (latlngs.length === 0) return;
  if (latlngs.length === 1) {
    map.setView(latlngs[0], 13);
  } else {
    try {
      map.fitBounds(latlngs, { padding: [60, 60], maxZoom: 14 });
    } catch(e) {
      map.setView(latlngs[0], 12);
    }
  }
}

/**
 * setMapTheme(theme) — switch tile layer.
 * theme: 'dark' | 'light' | 'topo' | 'sat'
 */
function setMapTheme(theme) {
  if (!LAYERS[theme] || theme === currentTheme) return;
  map.removeLayer(LAYERS[currentTheme]);
  LAYERS[theme].addTo(map);
  currentTheme = theme;
}

// ─── Internal helpers ─────────────────────────────────────────────────────────

function _rebuildBounds() {
  symbolLatLngs = Object.values(symbolData).map(function(d) {
    return [d.lat, d.lng];
  });
}

// ─── Coordinate display on hover ──────────────────────────────────────────────
var _coordDiv = L.DomUtil.create('div', '', document.body);
_coordDiv.style.cssText = 'position:fixed;bottom:6px;left:50%;transform:translateX(-50%);'
  + 'background:rgba(10,20,40,0.75);color:#8ab4d4;font-size:10px;font-family:monospace;'
  + 'padding:2px 8px;border-radius:3px;pointer-events:none;z-index:9999;display:none';
document.body.appendChild(_coordDiv);

map.on('mousemove', function(e) {
  _coordDiv.style.display = 'block';
  _coordDiv.textContent = e.latlng.lat.toFixed(5) + '°N  ' + e.latlng.lng.toFixed(5) + '°E';
});
map.on('mouseout', function() {
  _coordDiv.style.display = 'none';
});
</script>
</body>
</html>
